name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxext-dev libxft-dev libxrandr-dev libxtst6 libpulse0 libxres1 xvfb xauth
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/test-hotkey.sh
      - run: ./scripts/test-clipboard.sh
      - run: ./scripts/test-shutdown.sh
      - run: ./scripts/test-scale.sh
      - run: ./scripts/test-desktop.sh
      - run: cargo build --release --locked
      - name: Prepare release assets
        run: |
          mkdir -p target/release-assets
          cp target/release/likh target/release-assets/likh-linux-x86_64
          cd target/release-assets
          sha256sum likh-linux-x86_64 > likh-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: likh-linux-x86_64
          path: target/release-assets/
          if-no-files-found: error
